# Only the settings declared here are pushed to the hosted project
# (supabase config push). Everything else stays as configured in the dashboard.
project_id = "sample-project"

[auth]
site_url = "https://sample-project.vercel.app"
additional_redirect_urls = ["https://sample-project.vercel.app/**", "http://localhost:3000/**"]
# /admin is for one seeded account; nobody can sign themselves up.
enable_signup = false

[auth.email]
enable_signup = false

[auth.email.template.invite]
subject = "Set your sample-project admin password"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your sample-project admin password"
content_path = "./supabase/templates/recovery.html"
